name: CI

# Test gate: unit + eval harness + integration on every push/PR; Playwright E2E
# as the pre-PR gate (PRs targeting main only), matching the project workflow.
"on":
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-and-integration:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: auleg_smoke
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Matches the integration setup default and the Playwright webServer config.
      DATABASE_URL: postgresql://postgres@localhost:55432/auleg_smoke
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-minimum-32-characters!!
      NODE_ENV: test
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Push schema to test database
        working-directory: server
        run: npx prisma db push

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: Audit engine eval gate
        working-directory: server
        run: node scripts/eval-engine.js --min-f1 0.85

      - name: Integration tests
        working-directory: server
        run: npx jest --config jest.integration.config.js --forceExit --runInBand

  e2e:
    name: Playwright E2E (pre-PR gate)
    # Heavier full-stack gate — only on PRs targeting main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: auleg_smoke
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres@localhost:55432/auleg_smoke

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps (Playwright)
        run: npm ci

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Generate Prisma client + push schema
        working-directory: server
        run: |
          npx prisma generate
          npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Playwright auto-starts server + dashboard)
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
